<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Farm Melon Sleman</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Leaflet CSS untuk Peta -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- FontAwesome untuk Ikon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .hero-section { background: linear-gradient(135deg, #198754, #146c43); color: white; padding: 3rem 1rem; border-radius: 0 0 1.5rem 1.5rem; margin-bottom: 2rem; }
    #map { height: 400px; border-radius: 1rem; box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.05); }
    .card { border: none; border-radius: 1rem; box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.05); transition: transform 0.2s; }
    .card:hover { transform: translateY(-3px); }
  </style>
</head>
<body>

  <!-- Hero Header -->
  <div class="hero-section text-center">
    <div class="container">
      <h1 class="fw-bold mb-3"><i class="fa-solid fa-seedling me-2"></i>Open Farm Melon Sleman</h1>
      <p class="lead mb-0">Platform Informasi Agrowisata & Petik Melon Langsung dari Greenhouse</p>
    </div>
  </div>

  <div class="container mb-5">
    
    <!-- Peta Sebaran -->
    <div class="card p-3 mb-4">
      <h5 class="fw-bold mb-3 text-success"><i class="fa-solid fa-map-location-dot me-2"></i>Peta Sebaran Greenhouse Open Farm (Sleman)</h5>
      <div id="map"></div>
    </div>

    <!-- Filter Pencarian -->
    <div class="card p-4 mb-4">
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label fw-semibold"><i class="fa-solid fa-filter me-1 text-success"></i> Wilayah (Kapanewon)</label>
          <select id="filterKapanewon" class="form-select" onchange="filterData()">
            <option value="">Semua Kapanewon</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label fw-semibold"><i class="fa-solid fa-calendar-days me-1 text-success"></i> Status Agenda</label>
          <select id="filterStatus" class="form-select" onchange="filterData()">
            <option value="">Semua Status</option>
            <option value="Berlangsung">Berlangsung</option>
            <option value="Mendatang">Mendatang</option>
            <option value="Selesai">Selesai</option>
          </select>
        </div>
        <div class="col-md-4">
          <label class="form-label fw-semibold"><i class="fa-solid fa-magnifying-glass me-1 text-success"></i> Cari Melon / Greenhouse</label>
          <input type="text" id="searchKeyword" class="form-control" placeholder="Contoh: Inthanon, Pakem..." oninput="filterData()">
        </div>
      </div>
    </div>

    <!-- Kontainer Kartu Agenda -->
    <div id="containerCard" class="row g-4">
      <!-- Data akan dimuat secara dinamis via JavaScript -->
    </div>
    
    <div id="noDataMessage" class="text-center text-muted py-5 d-none">
      <h5>Belum ada agenda open farm disetujui.</h5>
    </div>
  </div>

  <!-- Leaflet JS & Bootstrap Bundle JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // ⚠️ GANTI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA YANG TERBARU
    const API_URL = "URL_WEB_APP_ANDA_DISINI";

    let globalData = [];
    let map = L.map('map').setView([-7.75, 110.38], 11);
    let markersLayer = L.layerGroup().addTo(map);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // Ambil Data saat halaman dimuat
    document.addEventListener("DOMContentLoaded", () => {
      fetchData();
    });

    function fetchData() {
      fetch(API_URL)
        .then(res => res.json())
        .then(data => {
          // Hanya ambil data yang statusApprove-nya 'Approved' atau 'Disetujui'
          globalData = data.filter(item => item.statusApprove && item.statusApprove.toLowerCase() === 'approved');
          populateFilterKapanewon(globalData);
          renderCards(globalData);
          renderMap(globalData);
        })
        .catch(err => console.error("Gagal memuat data:", err));
    }

    function populateFilterKapanewon(data) {
      const select = document.getElementById('filterKapanewon');
      const kapanewonSet = [...new Set(data.map(item => item.kapanewon))].filter(Boolean);
      
      select.innerHTML = '<option value="">Semua Kapanewon</option>';
      kapanewonSet.forEach(kap => {
        select.innerHTML += `<option value="${kap}">${kap}</option>`;
      });
    }

    function filterData() {
      const kapVal = document.getElementById('filterKapanewon').value.toLowerCase();
      const statusVal = document.getElementById('filterStatus').value.toLowerCase();
      const searchVal = document.getElementById('searchKeyword').value.toLowerCase();

      const filtered = globalData.filter(item => {
        const matchKap = !kapVal || item.kapanewon.toLowerCase() === kapVal;
        const matchStatus = !statusVal || item.status.toLowerCase() === statusVal;
        const matchSearch = !searchVal || 
          item.namaGH.toLowerCase().includes(searchVal) || 
          item.varietas.toLowerCase().includes(searchVal) ||
          item.alamat.toLowerCase().includes(searchVal);
        return matchKap && matchStatus && matchSearch;
      });

      renderCards(filtered);
      renderMap(filtered);
    }

    function renderCards(data) {
      const container = document.getElementById('containerCard');
      const noData = document.getElementById('noDataMessage');
      container.innerHTML = '';

      if (data.length === 0) {
        noData.classList.remove('d-none');
        return;
      }
      noData.classList.add('d-none');

      data.forEach(item => {
        const hargaFmt = Number(item.harga) ? "Rp " + Number(item.harga).toLocaleString('id-ID') : item.harga;
        
        container.innerHTML += `
          <div class="col-md-4">
            <div class="card h-100 p-3">
              <div class="card-body">
                <span class="badge bg-success mb-2">${item.status}</span>
                <h4 class="card-title fw-bold text-success">${item.namaGH}</h4>
                <p class="text-muted small mb-2"><i class="fa-solid fa-location-dot me-1"></i>${item.alamat}, ${item.kapanewon}</p>
                <hr>
                <p class="mb-1"><strong>Varietas:</strong> ${item.varietas}</p>
                <p class="mb-1"><strong>Tanggal:</strong> ${item.tglMulai} s/d ${item.tglSelesai}</p>
                <p class="mb-1"><strong>Jam Operasional:</strong> ${item.jam}</p>
                <p class="mb-3"><strong>Harga Petik:</strong> <span class="text-success fw-bold">${hargaFmt}</span></p>
                
                <div class="d-grid gap-2">
                  <a href="${item.maps}" target="_blank" class="btn btn-outline-success btn-sm">
                    <i class="fa-solid fa-map me-1"></i> Buka Google Maps
                  </a>
                  <button class="btn btn-success btn-sm" onclick='downloadFlyer(${JSON.stringify(item)})'>
                    <i class="fa-solid fa-download me-1"></i> Unduh Flyer Promosi (JPG)
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;
      });
    }

    function renderMap(data) {
      markersLayer.clearLayers();
      let bounds = [];

      data.forEach(item => {
        if (item.lat && item.lng) {
          const marker = L.marker([item.lat, item.lng]).bindPopup(`
            <b>${item.namaGH}</b><br>
            Varietas: ${item.varietas}<br>
            <a href="${item.maps}" target="_blank">Buka di Maps</a>
          `);
          markersLayer.addLayer(marker);
          bounds.push([item.lat, item.lng]);
        }
      });

      if (bounds.length > 0) {
        map.fitBounds(bounds, { padding: [50, 50], maxZoom: 14 });
      }
    }

    // Fungsi Pengunduhan Flyer JPG (Lengkap dengan parameter Alamat & Jam)
    function downloadFlyer(item) {
      // Indikator loading sederhana pada tombol
      event.target.disabled = true;
      const originalText = event.target.innerHTML;
      event.target.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-1"></i> Meracik Flyer...';

      fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'generateFlyer',
          data: {
            namaGH: item.namaGH,
            kapanewon: item.kapanewon,
            varietas: item.varietas,
            tglMulai: item.tglMulai,
            tglSelesai: item.tglSelesai,
            harga: item.harga,
            // Variabel lengkap agar tidak strip (-)
            alamat: item.alamat,
            jam: item.jam
          }
        })
      })
      .then(res => res.json())
      .then(result => {
        event.target.disabled = false;
        event.target.innerHTML = originalText;

        if (result.success && result.downloadUrl) {
          window.open(result.downloadUrl, '_blank');
        } else {
          alert("Gagal membuat flyer: " + (result.message || "Terjadi kesalahan"));
        }
      })
      .catch(err => {
        event.target.disabled = false;
        event.target.innerHTML = originalText;
        console.error("Error:", err);
        alert("Terjadi kesalahan jaringan.");
      });
    }
  </script>
</body>
</html>
